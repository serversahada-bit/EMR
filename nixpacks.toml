# Build Coolify (Nixpacks). Selain Node, halaman Import Progres (/import)
# memanggil skrip Python di skrip/impor — jadi Python + pustakanya ikut
# dipasang di venv tersendiri. "..." = pertahankan bawaan Nixpacks.
#
# Dipasang di fase build (bukan install): fase install Node hanya
# menyalin package.json + lockfile, jadi requirements.txt belum ada.
[phases.setup]
nixPkgs = ["...", "python311"]

[phases.build]
cmds = [
  "python3 -m venv skrip/impor/.venv && skrip/impor/.venv/bin/pip install --no-cache-dir -r skrip/impor/requirements.txt",
  "...",
]
